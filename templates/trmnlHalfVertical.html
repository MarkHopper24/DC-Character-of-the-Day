<div class="layout layout--col layout--stretch gap--xsmall">
  <div class="row row--center h--[3cqh] w--full ">
    <img class="image image-dither image--contain w--full h--full" alt="{{ Name }}" src="{{ ImageURL }}">
  </div>
  <div class="flex flex--col gap--large stretch">
    <span class="title title--medium lg:title--xxlarge text--center w--full" data-clamp="2">
      {{ Name }}
    </span>
    <span class="label lg:label--medium text--" data-clamp="2" data-clamp-lg="4">
      {{ Description }}
    </span>
    <div class="item w--full">
      <div class="meta"></div>
      <div class="content">
        <span class="label label--small">First Appearance</span>
        <span class="value value--xsmall" data-value-fit="true">{{ FirstComicTitle }}</span>
        <span class="label label--small">{{ FirstAppearance }}</span>
      </div>
    </div>
    <div class="stretch-y"></div>
    <div class="flex flex--col flex--center-x gap--xsmall">
      <img class="image image--contain w--12 h--12 md:w--12 md:h--12 lg:w--24 lg:h--24" alt="ComicVine Wiki" src="https://raw.githubusercontent.com/MarkHopper24/DC-Character-of-the-Day/refs/heads/main/characterQR.jpg">
      <span class="label label--small" data-clamp="2">ComicVine Wiki</span>
    </div>
  </div>
</div>

<div class="title_bar">
  <img class="image" alt="DC"
       src="https://logos-world.net/wp-content/uploads/2020/08/DC-Comics-Logo.png">
  <span class="title">Character of the Day</span>
  <span class="instance">{{ Name }}</span>
</div>
