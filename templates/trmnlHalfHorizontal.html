<div class="layout layout--stretch gap--small">
  <div class="grid grid--cols-6 gap--small h--full w--full">
    <div class="col col--center col--span-2 h--full">
      <img class="image image-dither image--contain w--full h--full" alt="{{ Name }}" src="{{ ImageURL }}">
    </div>

    <div class="col col--span-4 flex--col gap--xsmall h--full">
      <span class="title title--medium lg:title--xxlarge text--center w--full" data-clamp="1">
        {{ Name }}
      </span>
      <div class="divider w--full"></div>
      <span class="description lg:description " data-clamp="3" data-clamp-lg="3">
        {{ Description }}
      </span>
      <div class="stretch-y"></div>
            <img class="image image--contain w--16 h--16 md:w--16 md:h--16 lg:w--28 lg:h--28" alt="ComicVine Wiki" src="https://raw.githubusercontent.com/MarkHopper24/DC-Character-of-the-Day/refs/heads/main/characterQR.jpg">
      <span class="label label--small text--center" data-clamp="2">ComicVine Wiki</span>
      <div class="item w--full">
        <div class="meta"></div>
        <div class="content">
          <span class="label label--small">First Appearance</span>
          <span class="value value--xsmall" data-value-fit="true">{{ FirstComicTitle }}</span>
          <span class="label label--small">{{ FirstAppearance }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="title_bar">
  <img class="image" alt="DC"
       src="https://logos-world.net/wp-content/uploads/2020/08/DC-Comics-Logo.png">
  <span class="title">Character of the Day</span>
  <span class="instance">{{ Name }}</span>
</div>
