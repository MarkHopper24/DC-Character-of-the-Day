name: DC Character of the Day
description: A new DC Comics character each day
strategy: polling
framework_version: 3.0.5
no_screen_padding: 'no'
dark_mode: 'no'
polling_url: https://raw.githubusercontent.com/MarkHopper24/DC-Character-of-the-Day/refs/heads/main/DCCharacterOfTheDay.json
polling_verb: get
refresh_interval: 1440
custom_fields:
- keyname: About
  name: About This Plugin
  field_type: author_bio
  description: >-
    This plugin fetches and displays information about a random DC Comics character every day from Comic Vine's API.<br><br>
    This plugin was created by Mark Hopper, Senior PM Architect @ Microsoft and cat dad. Check out his other projects on GitHub 🙂
  github_url: https://github.com/MarkHopper24
  learn_more_url: https://github.com/MarkHopper24/DC-Character-of-the-Day
  email_address: mark.hopper24@gmail.com
  category: comics
