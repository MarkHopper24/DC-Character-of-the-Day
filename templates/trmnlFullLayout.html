 <div class="layout layout--stretch gap--medium">
   <div class="grid grid--cols-6 gap--medium h--full">
     <div class="col col--span-3 h--full">
       <img class="image image-dither image--contain w--full h--full" alt="{{ Name }}" src="{{ ImageURL }}">
     </div>
 
     <div class="col col--span-3 flex flex--col gap--large h--full">
       <span class="title title--xlarge lg:title--xxlarge text--center w--full" data-value-fit="true" data-pixel-perfect="true">
         {{ Name }}
       </span>
 
       <span class="divider w--full"></span>
 
       <div class="flex flex--col  flex--grow  ">
         <span class="description description--large lg:description--xxlarge" data-clamp-md="11" data-clamp-lg="19">{{ Description }}</span>
       </div>

       <div class="divider w--full"></div>
       <div class="flex flex--row  gap--large w--full ">
         <div class="item flex--grow w--full h--full">
           <div class="meta"></div>
           <div class="content">
             <span class="label">First Appearance</span>
             <span class="value value--xsmall lg:value--small" data-value-fit="true">{{ FirstComicTitle }}</span>
             <span class="label">{{ FirstAppearance }}</span>
           </div>
         </div> 
         <div class="flex flex--col  w--full flex--grow">
           <img class="image image--contain w--16 h--16 lg:w--30 lg:h--30" alt="ComicVine" src="https://raw.githubusercontent.com/MarkHopper24/DC-Character-of-the-Day/refs/heads/main/characterQR.jpg">
           <span class="label label--small ">ComicVine</span>
         </div>
       </div>
     </div>
   </div>
 </div>
 
 <div class="title_bar">
   <img class="image" alt="DC" src="https://logos-world.net/wp-content/uploads/2020/08/DC-Comics-Logo.png">
   <span class="title">Character of the Day</span>
   <span class="instance">{{ Name }}</span>
 </div>
